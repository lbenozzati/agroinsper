version: "3.0.0"
cutoff_date: "2026-10-14"
seed: 42
base_year: 2026
end_year: 2035
mc_sims: 2000
contract_start_year: 2029

paths:
  raw: data/raw
  processed: data/processed
  outputs: outputs
  v2_dir: ..

regions:
  SALMON: {application: salmon, asia: false, price_param: price_mult_salmon}
  SHRIMP_AM: {application: shrimp, asia: false, price_param: price_mult_shrimp}
  SHRIMP_ASIA: {application: shrimp, asia: true, price_param: price_mult_shrimp}
  CHINA: {application: china_aquafeed, asia: true, price_param: price_mult_china}
  PET: {application: pet_food, asia: false, price_param: price_mult_pet}

scenarios: [stress, base, upside]

alternatives:
  A1_ORI:
    label: "A1 Orindiúva: 1 módulo"
    units: [{site: BR_ORI_EXP}]
  A2_ORI_STAGED:
    label: "A2 Orindiúva: 2 módulos faseados"
    units:
      - {site: BR_ORI_EXP}
      - {site: BR_ORI_EXP, conditional: utilisation, utilities_factor: 0.9, buildings_factor: 0.6}
  B_BR_GF:
    label: "B Greenfield Brasil (GO, ilustrativo)"
    units: [{site: BR_GF_GO}]
  C_TH_NSN:
    label: "C Tailândia: Nakhon Sawan"
    units: [{site: TH_NSN}]
  D_TH_RYG:
    label: "D Tailândia: Rayong"
    units: [{site: TH_RYG}]
  E_ORI_HUB:
    label: "E Orindiúva + hub asiático (sem fermentação)"
    units: [{site: BR_ORI_EXP}]
    hub: true
  F_ORI_THEN_TH:
    label: "F Orindiúva agora + Tailândia se gatilho"
    units:
      - {site: BR_ORI_EXP}
      - {site: TH_NSN, conditional: asia}
  G_ORI_TH_NOW:
    label: "G Orindiúva + Tailândia já"
    units: [{site: BR_ORI_EXP}, {site: TH_NSN}]

monte_carlo:
  variables:
    sugar_BR:   {low: 300,   mode: 370,  high: 520}
    sugar_TH:   {low: 450,   mode: 560,  high: 700}
    fx_BR:      {low: -0.15, mode: 0.0,  high: 0.25}
    fx_TH:      {low: -0.10, mode: 0.0,  high: 0.10}
    fish_oil:   {low: 2500,  mode: 4500, high: 6800}
    demand:     {low: 0.5,   mode: 1.0,  high: 1.4}
    capex_BR:   {low: 0.85,  mode: 1.0,  high: 1.4}
    capex_TH:   {low: 0.85,  mode: 1.05, high: 1.5}
    dha_yield:  {low: 0.055, mode: 0.075, high: 0.10}
    oee:        {low: 0.75,  mode: 0.85, high: 0.92}
    asia_mix:   {low: 0.6,   mode: 1.0,  high: 1.4}
  correlations:
    - [sugar_BR, sugar_TH, 0.6]
    - [sugar_BR, fx_BR, -0.4]
    - [sugar_TH, fx_BR, -0.2]
    - [fx_BR, fx_TH, 0.3]
    - [fish_oil, demand, 0.4]
    - [capex_BR, capex_TH, 0.5]
    - [dha_yield, oee, 0.3]
  delay_threshold_capex: 1.3

frontier:
  asia_contract_t: [0, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000]
  price_usd_kg_dha: [15, 17.5, 20, 22.5, 25, 27.5, 30, 32.5, 35, 37.5, 40, 42.5, 45]
  capex_ori_musd: [60, 90, 120]
  slider_bounds:
    contracted_t: [0, 20000]
    price_usd_kg_dha: [15, 45]
    capex_ori_musd: [40, 160]

palette:
  navy: "#000E38"
  deep: "#060216"
  purple: "#2E0133"
  white: "#FFFFFF"
  text2: "#D5D2DA"
  silver: "#B6B3BA"
  blue: "#4057C8"
  magenta: "#8C2F78"
  light_blue: "#9FB0FA"
  violet: "#5C3C9E"
