      ma_lsci:                 {sub: ac_log, weight: 0.20, method: log, worst: 5, best: 150, label: "Conectividade marítima UNCTAD LSCI"}
      shr_production_t:            {sub: sz_volume, weight: 0.50, method: log, worst: 20000, best: 2000000, label: "Produção de camarão (t)"}
      dha_need_t:                  {sub: sz_volume, weight: 0.50, method: log, worst: 30, best: 10000, label: "Necessidade técnica de DHA (t, derivado)"}
      shr_growth_5y_cagr:          {sub: sz_growth, weight: 0.40, method: linear, worst: -3, best: 12, label: "CAGR 5 anos (%)"}
      shr_growth_outlook:          {sub: sz_growth, weight: 0.60, method: linear, worst: -2, best: 8, label: "Crescimento esperado até 2030 (%/ano)"}
