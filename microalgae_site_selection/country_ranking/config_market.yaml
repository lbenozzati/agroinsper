      shr_intensive_share:         {sub: vl_intens, weight: 0.50, method: linear, worst: 1, best: 5, label: "Grau de intensificação (1-5, analista)"}
      shr_hatchery_pl_billion:     {sub: vl_intens, weight: 0.50, method: log, worst: 1, best: 300, label: "Pós-larvas (bilhões/ano)"}
      shr_algal_dha_adoption:      {sub: ac_adopt, weight: 1.0, method: linear, worst: 0, best: 1, label: "Adoção de DHA de algas (0/0,5/1)"}
