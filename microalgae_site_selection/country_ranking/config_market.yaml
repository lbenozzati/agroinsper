      vl_price:   {criterion: value, label: "Valor do produto final (exportação)", weight: 0.45}
      vl_intens:  {criterion: value, label: "Intensificação e larvicultura (uso de DHA)", weight: 0.55}
      ac_adopt:   {criterion: access, label: "Adoção documentada de DHA de algas", weight: 0.30}
      ac_feed:    {criterion: access, label: "Fábricas de ração dos grandes clientes", weight: 0.25}
      ac_rel:     {criterion: access, label: "Relacionamento Corbion/canal", weight: 0.20}
      ac_log:     {criterion: access, label: "Logística até o cliente (a partir de Orindiúva)", weight: 0.25}
      rg_tariff:  {criterion: regulatory, label: "Tarifa de importação do ingrediente", weight: 0.50}
      rg_reg:     {criterion: regulatory, label: "Registro do ingrediente", weight: 0.50}
    metrics:
      shr_transit_days:        {sub: ac_log, weight: 0.50, method: linear, worst: 45, best: 3, label: "Dias porta a porta desde Orindiúva (derivado)"}
